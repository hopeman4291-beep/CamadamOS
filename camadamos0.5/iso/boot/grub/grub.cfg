set timeout=3
set default=0
insmod all_video
insmod multiboot
set gfxmode=auto
set gfxpayload=keep

menuentry "CamadamOS" {
    echo "Loading CamadamOS..."
    set gfxpayload=auto
    multiboot /boot/camadamos.elf
    boot
}
menuentry "CamadamOS (1366 x 768 laptop screen)" {
    echo "Loading CamadamOS..."
    set gfxpayload=1366x768x32,1366x768x24,1360x768x32,auto
    multiboot /boot/camadamos.elf
    boot
}
menuentry "CamadamOS (safe graphics, 1024 x 768)" {
    echo "Loading CamadamOS in safe graphics mode..."
    set gfxpayload=1024x768x32,1024x768,auto
    multiboot /boot/camadamos.elf
    boot
}
menuentry "CamadamOS (without USB driver)" {
    echo "Loading CamadamOS without the USB driver..."
    set gfxpayload=auto
    multiboot /boot/camadamos.elf nousb
    boot
}
menuentry "Restart" {
    reboot
}
